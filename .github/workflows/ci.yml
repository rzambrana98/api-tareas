name: CI
on:
 push:
 branches: [main]
 pull_request:
 branches: [main]
jobs:
 ci:
 name: CI
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v7
 - uses: actions/setup-python@v7
 with:
 python-version: "3.12"
 - name: Instalar dependencias
 run: python -m pip install -r requirements-dev.txt
 - name: Pruebas
 run: bash scripts/pruebas.sh
